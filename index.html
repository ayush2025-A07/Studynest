<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyNest | Cozy Notes</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  
  <!-- Quill.js for Rich Text Editor -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  
  <!-- html2pdf for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cozy: {
              bg: '#FDFBF7',
              sidebar: '#F4EFE6',
              text: '#4A4036',
              accent: '#D4B895',
              green: '#A8D5BA',
              lavender: '#C8B6E2',
              card: '#FFFFFF'
            }
          },
          fontFamily: {
            sans: ['Nunito', 'sans-serif'],
            serif: ['Merriweather', 'serif']
          }
        }
      }
    }
  </script>

  <style>
    /* Cozy Overrides & Smooth Scrollbars */
    body { color: #4A4036; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D4B895; border-radius: 10px; }
    
    .ql-toolbar.ql-snow {
      border: none !important;
      background: white;
      border-radius: 20px 20px 0 0;
      padding: 12px !important;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .ql-container.ql-snow {
      border: none !important;
      background: white;
      border-radius: 0 0 20px 20px;
      font-family: 'Merriweather', serif;
      font-size: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .ql-editor { padding: 2rem; min-height: 60vh; }
    
    .glass-panel {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="bg-cozy-bg h-screen flex overflow-hidden transition-colors duration-300">

  <!-- Sidebar -->
  <aside class="w-72 bg-cozy-sidebar p-6 flex flex-col shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-10">
    <div class="flex items-center gap-3 mb-8">
      <i class="fa-solid fa-mug-hot text-cozy-accent text-2xl"></i>
      <h1 class="text-2xl font-bold tracking-wide">StudyNest</h1>
    </div>

    <div class="flex-1 overflow-y-auto pr-2">
      <h2 class="text-sm uppercase tracking-wider text-gray-500 font-bold mb-4">Your Subjects</h2>
      <ul id="subject-list" class="space-y-2 mb-6">
        <!-- Subjects injected via JS -->
      </ul>
      <button onclick="addSubject()" class="w-full py-3 rounded-xl border-2 border-dashed border-cozy-accent text-cozy-text hover:bg-cozy-accent/10 transition flex items-center justify-center gap-2 font-semibold">
        <i class="fa-solid fa-plus"></i> New Subject
      </button>
    </div>

    <div class="mt-auto pt-6 border-t border-cozy-accent/20">
      <p class="text-sm text-gray-500 flex items-center gap-2"><i class="fa-solid fa-fire text-orange-400"></i> <span id="note-count">0</span> Notes Written</p>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden">
    <!-- Topbar -->
    <header class="h-20 px-8 flex items-center justify-between glass-panel z-10 relative">
      <div>
        <p id="current-date" class="text-sm text-gray-500 font-semibold"></p>
        <p class="text-lg font-serif italic text-cozy-text">"Small daily efforts build the bridge to success."</p>
      </div>
      <div class="flex gap-4">
        <!-- New Note Button -->
        <button onclick="createNewNote()" id="btn-new-note" class="hidden bg-cozy-green text-green-900 px-5 py-2.5 rounded-xl font-bold shadow-sm hover:shadow-md transition flex items-center gap-2">
          <i class="fa-solid fa-pen-nib"></i> Write Note
        </button>
        <!-- Delete Note Button -->
        <button onclick="deleteNote()" id="btn-delete-note" class="hidden bg-white border border-red-200 text-red-400 px-5 py-2.5 rounded-xl font-bold shadow-sm hover:shadow-md transition flex items-center gap-2 hover:bg-red-50 hover:text-red-500">
          <i class="fa-solid fa-trash-can"></i> Delete
        </button>
        <!-- Export PDF Button -->
        <button onclick="exportToPDF()" id="btn-export" class="hidden bg-white border border-gray-200 text-gray-700 px-5 py-2.5 rounded-xl font-bold shadow-sm hover:shadow-md transition flex items-center gap-2">
          <i class="fa-solid fa-file-pdf text-red-400"></i> Export PDF
        </button>
      </div>
    </header>

    <!-- Editor Workspace -->
    <div class="flex-1 overflow-y-auto p-8 relative" id="workspace">
      
      <!-- Empty State -->
      <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center opacity-70">
        <i class="fa-solid fa-seedling text-6xl text-cozy-green mb-4"></i>
        <h2 class="text-2xl font-bold mb-2">Welcome to your cozy corner</h2>
        <p class="text-gray-500 max-w-md">Select a subject from the sidebar or create a new one to start writing notes.</p>
      </div>

      <!-- Editor Area (Hidden by default) -->
      <div id="editor-area" class="hidden max-w-5xl mx-auto flex gap-6 h-full">
        
        <!-- Note List for Active Subject -->
        <div class="w-1/3 flex flex-col gap-3 overflow-y-auto pr-2 pb-8" id="note-list">
          <!-- Notes injected via JS -->
        </div>

        <!-- Active Editor -->
        <div class="w-2/3 flex flex-col pb-8">
          <input type="text" id="note-title" placeholder="Note Title..." class="text-3xl font-bold bg-transparent border-none focus:outline-none mb-4 font-serif text-cozy-text">
          <div id="editor" class="flex-1"></div>
        </div>

      </div>
    </div>
  </main>

  <script>
    // --- Data Management (Local Storage) ---
    const STORAGE_KEY = 'studyNestData';
    let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      subjects: [
        { id: '1', name: 'Computer Science', color: '#A8D5BA', notes: [] }
      ]
    };
    
    let activeSubjectId = null;
    let activeNoteId = null;
    let quill;

    // --- Initialization ---
    document.addEventListener('DOMContentLoaded', () => {
      // Set Date
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', options);

      // Init Quill
      quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'Pour yourself a warm drink and start writing...',
        modules: {
          toolbar: [
            [{ 'header': [1, 2, 3, false] }],
            ['bold', 'italic', 'underline', 'strike'],
            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
            ['blockquote', 'code-block'],
            [{ 'color': [] }, { 'background': [] }],
            ['clean']
          ]
        }
      });

      // Auto-save on text change
      quill.on('text-change', () => {
        if (activeNoteId) saveCurrentNote();
      });

      document.getElementById('note-title').addEventListener('input', () => {
        if (activeNoteId) saveCurrentNote();
        renderNoteList(); // update title in side list
      });

      renderSubjects();
      updateStats();
    });

    // --- Core Functions ---
    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      updateStats();
    }

    function generateId() {
      return Math.random().toString(36).substr(2, 9);
    }

    function updateStats() {
      const totalNotes = appData.subjects.reduce((sum, sub) => sum + sub.notes.length, 0);
      document.getElementById('note-count').innerText = totalNotes;
    }

    // --- Subject Management ---
    function addSubject() {
      const name = prompt("Enter subject name:");
      if (!name) return;
      
      const newSub = {
        id: generateId(),
        name: name,
        color: ['#A8D5BA', '#C8B6E2', '#D4B895', '#FAD0C4'][Math.floor(Math.random()*4)],
        notes: []
      };
      appData.subjects.push(newSub);
      saveData();
      renderSubjects();
    }

    function deleteSubject(event, id) {
      event.stopPropagation(); // Prevents triggering the selectSubject function
      if (confirm("Are you sure you want to delete this subject and all its notes?")) {
        appData.subjects = appData.subjects.filter(s => s.id !== id);
        
        // If the deleted subject is currently active, clear the workspace
        if (activeSubjectId === id) {
          activeSubjectId = null;
          activeNoteId = null;
          document.getElementById('empty-state').classList.remove('hidden');
          document.getElementById('editor-area').classList.add('hidden');
          document.getElementById('btn-new-note').classList.add('hidden');
          document.getElementById('btn-export').classList.add('hidden');
          document.getElementById('btn-delete-note').classList.add('hidden');
        }
        
        saveData();
        renderSubjects();
      }
    }

    function renderSubjects() {
      const list = document.getElementById('subject-list');
      list.innerHTML = '';
      
      appData.subjects.forEach(sub => {
        const li = document.createElement('li');
        const isActive = sub.id === activeSubjectId;
        li.className = `p-3 rounded-xl cursor-pointer transition flex items-center justify-between group font-semibold ${isActive ? 'bg-white shadow-sm' : 'hover:bg-black/5'}`;
        li.onclick = () => selectSubject(sub.id);
        
        li.innerHTML = `
          <div class="flex items-center gap-3 flex-1 overflow-hidden">
            <div class="w-3 h-3 rounded-full flex-shrink-0" style="background-color: ${sub.color}"></div>
            <span class="truncate flex-1">${sub.name}</span>
          </div>
          <button onclick="deleteSubject(event, '${sub.id}')" class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-400 transition ml-2 p-1">
            <i class="fa-solid fa-trash-can text-sm"></i>
          </button>
        `;
        list.appendChild(li);
      });
    }

    function selectSubject(id) {
      activeSubjectId = id;
      activeNoteId = null;
      renderSubjects();
      
      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('editor-area').classList.remove('hidden');
      document.getElementById('btn-new-note').classList.remove('hidden');
      document.getElementById('btn-export').classList.add('hidden');
      document.getElementById('btn-delete-note').classList.add('hidden');
      
      document.getElementById('note-title').value = '';
      quill.root.innerHTML = '';
      quill.disable();

      renderNoteList();
    }

    // --- Note Management ---
    function createNewNote() {
      if (!activeSubjectId) return;
      
      const subject = appData.subjects.find(s => s.id === activeSubjectId);
      const newNote = {
        id: generateId(),
        title: 'Untitled Note',
        content: '',
        createdAt: new Date().toISOString()
      };
      
      subject.notes.unshift(newNote);
      saveData();
      selectNote(newNote.id);
    }

    function deleteNote() {
      if (!activeSubjectId || !activeNoteId) return;
      
      if (confirm("Are you sure you want to delete this note?")) {
        const subject = appData.subjects.find(s => s.id === activeSubjectId);
        subject.notes = subject.notes.filter(n => n.id !== activeNoteId);
        activeNoteId = null;
        
        // Clear editor
        document.getElementById('note-title').value = '';
        quill.root.innerHTML = '';
        quill.disable();
        
        // Hide note-specific buttons
        document.getElementById('btn-export').classList.add('hidden');
        document.getElementById('btn-delete-note').classList.add('hidden');
        
        saveData();
        renderNoteList();
      }
    }

    function renderNoteList() {
      if (!activeSubjectId) return;
      const subject = appData.subjects.find(s => s.id === activeSubjectId);
      const list = document.getElementById('note-list');
      list.innerHTML = '';

      if (subject.notes.length === 0) {
         list.innerHTML = '<p class="text-sm text-gray-400 text-center mt-8 italic">No notes yet. Click "Write Note" to start.</p>';
         return;
      }

      subject.notes.forEach(note => {
        const div = document.createElement('div');
        const isActive = note.id === activeNoteId;
        const date = new Date(note.createdAt).toLocaleDateString();
        
        div.className = `p-4 rounded-xl cursor-pointer transition border ${isActive ? 'bg-white border-cozy-accent shadow-sm' : 'bg-transparent border-transparent hover:bg-black/5'}`;
        div.onclick = () => selectNote(note.id);
        
        div.innerHTML = `
          <h3 class="font-bold text-gray-800 truncate">${note.title || 'Untitled Note'}</h3>
          <p class="text-xs text-gray-400 mt-1">${date}</p>
        `;
        list.appendChild(div);
      });
    }

    function selectNote(id) {
      activeNoteId = id;
      const subject = appData.subjects.find(s => s.id === activeSubjectId);
      const note = subject.notes.find(n => n.id === id);

      document.getElementById('note-title').value = note.title;
      quill.enable();
      quill.root.innerHTML = note.content;
      
      document.getElementById('btn-export').classList.remove('hidden');
      document.getElementById('btn-delete-note').classList.remove('hidden');
      renderNoteList();
    }

    function saveCurrentNote() {
      if (!activeSubjectId || !activeNoteId) return;
      const subject = appData.subjects.find(s => s.id === activeSubjectId);
      const note = subject.notes.find(n => n.id === activeNoteId);
      
      note.title = document.getElementById('note-title').value;
      note.content = quill.root.innerHTML;
      saveData();
    }

    // --- PDF Export ---
    function exportToPDF() {
      if (!activeSubjectId || !activeNoteId) return;
      
      const subject = appData.subjects.find(s => s.id === activeSubjectId);
      const note = subject.notes.find(n => n.id === activeNoteId);
      
      const printContainer = document.createElement('div');
      printContainer.innerHTML = `
        <div style="font-family: 'Merriweather', serif; padding: 40px; color: #333;">
          <p style="color: #666; font-family: 'Nunito', sans-serif; font-size: 12px; margin-bottom: 5px; text-transform: uppercase;">${subject.name}</p>
          <h1 style="font-size: 32px; font-weight: bold; margin-bottom: 5px; border-bottom: 2px solid ${subject.color}; padding-bottom: 10px;">${note.title}</h1>
          <p style="color: #999; font-family: 'Nunito', sans-serif; font-size: 12px; margin-bottom: 30px;">Last Updated: ${new Date().toLocaleDateString()}</p>
          <div style="line-height: 1.6; font-size: 14px;">
            ${note.content}
          </div>
        </div>
      `;

      const opt = {
        margin:       0.5,
        filename:     `${note.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
      };

      const btn = document.getElementById('btn-export');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Exporting...';
      
      html2pdf().set(opt).from(printContainer).save().then(() => {
        btn.innerHTML = originalText;
      });
    }
  </script>
</body>
</html>
